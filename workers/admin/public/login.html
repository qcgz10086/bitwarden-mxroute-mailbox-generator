<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮箱管理后台 · 登录</title><link rel="stylesheet" href="/login.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body>
<main>
  <button id="lang" class="toggle" type="button">EN</button>
  <h1 id="title">邮箱管理后台</h1>
  <p class="hint" id="subtitle">设置后台密码</p>
  <form id="auth-form">
    <label id="pwd-label" for="pwd"><span id="pwd-label-text">新密码</span><input id="pwd" type="password" maxlength="128" required autocomplete="new-password"></label>
    <button id="submit" type="submit">设置并进入</button>
  </form>
  <div class="mode" id="mode-row"><span id="mode-text"></span><button id="mode-toggle" type="button"></button></div>
  <p class="error" id="error" aria-live="polite"></p>
</main>
<script src="/login.js"></script>
</body></html>

<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重置后台密码</title><link rel="stylesheet" href="/login.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script></head><body>
<main>
  <h1 id="title">重置后台密码</h1>
  <p class="hint" id="subtitle">已通过现有登录方式验证身份</p>
  <form id="auth-form">
    <label id="pwd-label" for="pwd"><span id="pwd-label-text">新密码</span><input id="pwd" type="password" maxlength="128" required autocomplete="new-password"></label>
    <button id="submit" type="submit">重置并进入</button>
  </form>
  <p class="error" id="error" aria-live="polite"></p>
</main>
<script src="/reset.js"></script>
</body></html>
